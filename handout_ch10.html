<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>第十章 幾何光學 §10-1（動畫講義）</title>
<style>
body{margin:0;background:#d9d9d9;font-family:sans-serif}
.note{max-width:900px;margin:10px auto 0;font:13px/1.6 sans-serif;color:#444;text-align:center;padding:0 8px}
.page{position:relative;width:min(900px,calc(100vw - 16px));aspect-ratio:1434/2024;margin:12px auto;background:#fff center/100% 100% no-repeat;box-shadow:0 2px 10px #0003}
.fb{position:absolute;overflow:hidden}
.fb canvas{width:100%;height:100%;display:block}
.bar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:4px;padding:1px 3px;background:#ffffffd0;font:11px/1.2 sans-serif;color:#2a6b2a;opacity:.12;transition:opacity .2s}
.fb:hover .bar,.fb:focus-within .bar{opacity:1}
@media(hover:none) and (pointer:coarse){.bar{opacity:.85}}
.bar button{font:11px sans-serif;border:1px solid #bbb;background:#f6f6f6;border-radius:3px;padding:0 4px;cursor:pointer}
.bar input{width:70px;height:12px}.bar select{font-size:10px}.bar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head><body>
<div class="note">原講義：chap10 幾何光學 第 10-1、10-2 頁｜圖片改為動畫（滑鼠移到圖上可暫停或拖曳 θ₁）。<a href="index.html">← 回模擬首頁</a></div>
<div class="page" style="background-image:url(ch10_p1.png)">
 <div class="fb" id="b1"><canvas id="f1"></canvas><div class="bar"><button data-p="f1">⏸</button>θ₁<input type="range" id="f1s" min="0" max="80" step="0.1" value="40"><select id="f1m"><option value="1.333">水</option><option value="1.52" selected>冕玻璃</option><option value="2.419">鑽石</option></select><span id="f1r"></span></div></div>
 <div class="fb" id="b3"><canvas id="f3"></canvas><div class="bar"><button data-p="f3">⏸</button>θ₁<input type="range" id="f3s" min="25" max="65" step="0.1" value="50"><span id="f3r"></span></div></div>
</div>
<div class="page" style="background-image:url(ch10_p2.png)">
 <div class="fb" id="b4"><canvas id="f4"></canvas><div class="bar"><button data-p="f4">⏸</button>θ₁<input type="range" id="f4s" min="10" max="70" step="0.1" value="40"><span id="f4r"></span></div></div>
 <div class="fb" id="b5"><canvas id="f5"></canvas><div class="bar"><button data-p="f5">⏸</button>θ₁<input type="range" id="f5s" min="0" max="75" step="0.1" value="47"><span id="f5r"></span></div></div>
</div>
<script>
const PW=1434,PH=2024,D=Math.PI/180,RED='#d40000',DR='#b00000',GRN='#1a9b3a',BLUE='#dff4fb',FONT='"Times New Roman","PMingLiU","Noto Serif CJK TC",serif';
const BOX={f1:[864,289,1252,789,'b1'],f3:[829,1589,1224,1881,'b3'],f4:[164,1239,809,1547,'b4'],f5:[836,1249,1220,1609,'b5']};
const S={};for(const k in BOX){S[k]={p:1};const [x0,y0,x1,y1,id]=BOX[k],e=document.getElementById(id);Object.assign(e.style,{left:x0/PW*100+'%',top:y0/PH*100+'%',width:(x1-x0)/PW*100+'%',height:(y1-y0)/PH*100+'%'})}
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const s=S[b.dataset.p];s.p=!s.p;b.textContent=s.p?'⏸':'▶'});
document.querySelectorAll('input[type=range]').forEach(r=>r.addEventListener('input',()=>{const k=r.id.slice(0,2);S[k].p=0;document.querySelector('[data-p='+k+']').textContent='▶'}));
function ctx(k){const c=document.getElementById(k),[x0,y0,x1,y1]=BOX[k],w=x1-x0,h=y1-y0,s=c.clientWidth*(devicePixelRatio||1)/w;const W=Math.max(1,Math.round(w*s)),H=Math.max(1,Math.round(h*s));if(c.width!==W||c.height!==H){c.width=W;c.height=H}const g=c.getContext('2d');g.setTransform(s,0,0,s,0,0);g.fillStyle='#fff';g.fillRect(0,0,w,h);return [g,w,h]}
function line(g,x1,y1,x2,y2,col,w,dash){g.save();g.strokeStyle=col;g.lineWidth=w||2;g.setLineDash(dash||[]);g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();g.restore()}
function arrow(g,x1,y1,x2,y2,col,f,sz){sz=sz||10;const x=x1+(x2-x1)*f,y=y1+(y2-y1)*f,a=Math.atan2(y2-y1,x2-x1);g.save();g.fillStyle=col;g.translate(x,y);g.rotate(a);g.beginPath();g.moveTo(sz,0);g.lineTo(-sz,-sz*.55);g.lineTo(-sz,sz*.55);g.fill();g.restore()}
function arc(g,x,y,r,a0,a1,col,fill){if(Math.abs(a1-a0)<.005)return;g.save();g.strokeStyle=col;g.lineWidth=1.6;if(fill){g.fillStyle=col+'50';g.beginPath();g.moveTo(x,y);g.arc(x,y,r,a0,a1,a1<a0);g.closePath();g.fill()}g.beginPath();g.arc(x,y,r,a0,a1,a1<a0);g.stroke();g.restore()}
function txt(g,s,x,y,sz,col,it){g.save();g.fillStyle=col||'#222';g.font=(it?'italic ':'')+sz+'px '+FONT;g.fillText(s,x,y);g.restore()}
function th(k,t,lo,hi){const r=document.getElementById(k+'s');if(S[k].p){const v=(lo+hi)/2+(hi-lo)/2*Math.sin(t*0.6);r.value=v.toFixed(1);return v}return +r.value}
const snell=(n1,n2,a)=>{const s=n1*Math.sin(a)/n2;return s>1?null:Math.asin(s)};
const up=-Math.PI/2,dn=Math.PI/2;
// Fig1: original geometry, O=(194,263), θ1≈40°
function f1(t){const [g]=ctx('f1'),n2=+document.getElementById('f1m').value,a=th('f1',t,22,58)*D,b=snell(1,n2,a),ox=194,oy=263,L=Math.min(288,178/Math.sin(a),220/Math.cos(a));
line(g,4,oy,386,oy,'#222',2);line(g,ox,40,ox,475,'#888',1.6,[6,5]);
txt(g,'法線',170,30,26,'#666');txt(g,'N',203,52,26);txt(g,'第一介質',12,232,26);txt(g,'第二介質',12,322,26);txt(g,'O',166,296,26);txt(g,'入射點',222,246,26);
const ax=ox-L*Math.sin(a),ay=oy-L*Math.cos(a),bx=ox+L*Math.sin(a),cx=ox+250*Math.sin(b)/Math.cos(b)*Math.cos(b),cy=oy+250*Math.cos(b);
line(g,ax,ay,ox,oy,RED,2.6);arrow(g,ax,ay,ox,oy,RED,.18);line(g,ox,oy,bx,ay,RED,2.6);arrow(g,ox,oy,bx,ay,RED,.88);line(g,ox,oy,cx,cy,RED,2.6);arrow(g,ox,oy,cx,cy,RED,.68);
arc(g,ox,oy,52,up,up-a,GRN,1);arc(g,ox,oy,52,dn,dn-b,'#1f6fd0',1);
txt(g,'θ',ox-34-30*Math.sin(a/2),oy-62,26,GRN,1);txt(g,'1',ox-20-30*Math.sin(a/2),oy-56,15,GRN);
txt(g,'θ',ox+8+20*Math.sin(b/2),oy+80,26,'#1f6fd0',1);txt(g,'2',ox+22+20*Math.sin(b/2),oy+86,15,'#1f6fd0');
const ux=Math.sin(a),uy=Math.cos(a);txt(g,'A',ax+6-28,ay+28,26);txt(g,'入射線',ax+ux*40+14,ay+uy*40-6,26);txt(g,'B',bx-6,ay+30,26);txt(g,'反射線',bx-ux*40-110,ay+uy*40-6,26);
const cxl=ox+0.82*(cx-ox),cyl=oy+0.82*(cy-oy);txt(g,'折射線',cxl+14,cyl+6,26);txt(g,'C',cxl-24,cyl+38,26);
document.getElementById('f1r').textContent=`θ₁=${(a/D).toFixed(1)}° θ₂=${(b/D).toFixed(1)}° sinθ₁/sinθ₂=${n2}`}
// Fig3: Huygens, interface y=130, A=146, C=298
function f3(t){const [g,W,H]=ctx('f3'),n=1.33,a=th('f3',t,35,62)*D,b=Math.asin(Math.sin(a)/n),yI=130,Ax=146;
g.fillStyle=BLUE;g.fillRect(86,yI,W-86,H-yI);line(g,86,yI,W,yI,'#999',1);
const AC=152,Cx=Ax+AC,dx=Math.sin(a),dy=Math.cos(a),BC=AC*Math.sin(a),Bx=Cx-BC*dx,By=yI-BC*dy,AD=AC*Math.sin(b),Dx=Ax+AD*Math.sin(b),Dy=yI+AD*Math.cos(b);
const k=(t*0.35)%1.3,tau=Math.min(1,k);
[[Ax,0],[Cx,BC]].forEach(([x,s])=>{const L0=s+130,sx=x-L0*dx,sy=yI-L0*dy;line(g,sx,sy,x,yI,DR,3);arrow(g,sx,sy,x,yI,DR,s?.3:.45,9);const ex=x+(H-yI)*Math.tan(b);line(g,x,yI,ex,H,DR,3);arrow(g,x,yI,ex,H,DR,.75,9)});
line(g,Ax,yI-110,Ax,H,'#888',1.4,[3,3]);line(g,Bx,By,Ax,yI,'#335',1.4,[4,3]);line(g,Cx,yI,Dx,Dy,'#335',1.4,[4,3]);
const Px=Bx+tau*BC*dx,Py=By+tau*BC*dy,Ex=Ax+tau*AC,r=tau*AD,Tx=Ax+r*Math.sin(b),Ty=yI+r*Math.cos(b);
g.save();g.strokeStyle='#1f6fd0';g.globalAlpha=.5;g.setLineDash([3,3]);g.beginPath();g.arc(Ax,yI,Math.max(r,.1),0,Math.PI);g.stroke();g.restore();
line(g,Px,Py,Ex,yI,'#1f6fd0',3);line(g,Ex,yI,Tx,Ty,'#1f6fd0',3);
arc(g,Ax,yI,26,up,up-a,GRN,1);arc(g,Ax,yI,26,dn,dn-b,GRN,1);
txt(g,'θ',Ax-30,yI-30,20,'#222',1);txt(g,'1',Ax-19,yI-26,12);txt(g,'θ',Ax+2,yI+42,20,'#222',1);txt(g,'2',Ax+13,yI+46,12);
txt(g,'A',Ax-18,yI+16,20);txt(g,'B',Bx+6,By-2,20);txt(g,'C',Cx+6,yI-6,20);txt(g,'D',Dx-20,Dy+12,20);
txt(g,'ct',(Bx+Cx)/2+10,(By+yI)/2,20,'#222',1);txt(g,'vt',(Ax+Dx)/2+8,(yI+Dy)/2-4,20,'#222',1);
txt(g,'真空',318,70,22);txt(g,'光速',318,96,22);txt(g,'c',366,96,22,'#222',1);txt(g,'介質',318,166,22);txt(g,'光速',318,192,22);txt(g,'v',366,192,22,'#222',1);
document.getElementById('f3r').textContent=`θ₂=${(b/D).toFixed(1)}° BC/AD=${(BC/AD).toFixed(2)}=c/v`}
// Fig4: two panels, interface y=156, normals x=159/459
function f4(t){const [g,W,H]=ctx('f4'),a=th('f4',t,20,62)*D,b=snell(1,1.5,a),oy=156;g.fillStyle=BLUE;g.fillRect(4,oy,612,H-oy);line(g,4,oy,616,oy,'#999',1);
[0,1].forEach(k=>{const ox=159+300*k;line(g,ox,10,ox,H,'#999',1.2,[4,3]);txt(g,'法線',ox-18,26,19);
const L=150,ax=ox-L*Math.sin(a),ay=oy-L*Math.cos(a),cx=ox+(H-oy)*Math.tan(b),cy=H;line(g,ax,ay,ox,oy,DR,2.4);line(g,ox,oy,cx,cy,DR,2.4);
if(!k){arrow(g,ax,ay,ox,oy,DR,.7,8);arrow(g,ox,oy,cx,cy,DR,.6,8)}else{arrow(g,cx,cy,ox,oy,DR,.4,8);arrow(g,ox,oy,ax,ay,DR,.3,8)}
const f=(t*0.45)%1,pos=k?1-f:f,[px,py]=pos<.5?[ax+(ox-ax)*pos*2,ay+(oy-ay)*pos*2]:[ox+(cx-ox)*(pos-.5)*2,oy+(cy-oy)*(pos-.5)*2];g.fillStyle='#ff9a00';g.beginPath();g.arc(px,py,5,0,7);g.fill();
arc(g,ox,oy,34,up,up-a,GRN,1);arc(g,ox,oy,34,dn,dn-b,'#1f6fd0',1);
txt(g,'θ',ox+4,oy-38,19,'#222',1);txt(g,'1',ox+14,oy-35,11);txt(g,'θ',ox+6,oy+52,19,'#222',1);txt(g,'2',ox+16,oy+55,11);
txt(g,k?'折射線':'入射線',ax-44,ay-8,19);txt(g,k?'入射線':'折射線',cx+12,H-40,19);
const X=300*k;txt(g,'第一介質',X+8,94,19);txt(g,'n',X+32,118,16,'#222',1);txt(g,'1',X+41,122,10);txt(g,'第二介質',X+8,180,19);txt(g,'n',X+32,204,16,'#222',1);txt(g,'2',X+41,208,10);txt(g,'O',ox-16,oy+20,19)});
document.getElementById('f4r').textContent=`n₁=1.0 n₂=1.5 θ₂=${(b/D).toFixed(1)}° 反向角度不變`}
// Fig5: slab (45,118)-(368,239), entry x=193
function f5(t){const [g,W,H]=ctx('f5'),n2=1.6,a=th('f5',t,15,62)*D,b=snell(1,n2,a),y1=118,y2=239,ox=193;
g.strokeStyle='#222';g.lineWidth=2;g.strokeRect(45,y1,323,y2-y1);
const ex=ox+(y2-y1)*Math.tan(b);line(g,ox,48,ox,y2+20,'#444',1.4,[4,3]);line(g,ex,y1+10,ex,H-30,'#444',1.4,[4,3]);
const L=135,ax=ox-L*Math.sin(a),ay=y1-L*Math.cos(a);line(g,ax,ay,ox,y1,'#111',2.4);arrow(g,ax,ay,ox,y1,'#111',.35,8);
line(g,ox,y1,ex,y2,'#111',2.4);arrow(g,ox,y1,ex,y2,'#111',.6,8);
const L2=110,fx=ex+L2*Math.sin(a),fy=y2+L2*Math.cos(a);line(g,ex,y2,fx,fy,'#111',2.4);arrow(g,ex,y2,fx,fy,'#111',.7,8);
const gL=(H-y1)/Math.cos(a)*0.95;line(g,ox,y1,ox+gL*Math.sin(a),y1+gL*Math.cos(a),'#444',1.4,[5,4]);
const ux=Math.sin(a),uy=Math.cos(a),k=(ex-ox)*ux+(y2-y1)*uy;if(a>.05){line(g,ex,y2,ox+k*ux,y1+k*uy,'#e07000',2.6);txt(g,'d',(ex+ox+k*ux)/2+6,(y2+y1+k*uy)/2+2,18,'#e07000',1)}
arc(g,ox,y1,34,up,up-a,GRN,1);arc(g,ox,y1,38,dn,dn-b,'#1f6fd0',1);arc(g,ex,y2,34,dn,dn-a,GRN,1);
txt(g,'入射線',4,32,26);txt(g,'法線',170,32,26);txt(g,'介質',56,66,26);txt(g,'n',58,104,20,'#222',1);txt(g,'1',69,108,12);
txt(g,'θ',ox+6,y1-28,24,'#222',1);txt(g,'1',ox+18,y1-24,12);txt(g,'介質',96,160,26);txt(g,'n',98,196,22,'#222',1);txt(g,'2',110,200,12);
txt(g,'θ',ox+8,y1+66,24,'#222',1);txt(g,'2',ox+20,y1+70,12);txt(g,'θ',ex+6,y2+64,24,'#222',1);txt(g,'1',ex+18,y2+68,12);txt(g,'出射線',296,352,24);
document.getElementById('f5r').textContent=`n₂=1.6 θ₂=${(b/D).toFixed(1)}° d=${(Math.sin(a-b)/Math.cos(b)).toFixed(2)}t`}
function loop(ms){const t=ms/1000;for(const f of [f1,f3,f4,f5]){try{f(t)}catch(e){document.body.dataset.err=e.message}}requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
