<header><h1>三稜鏡色散</h1><p>折射率隨波長改變（短波長 n 較大），白光經稜鏡後各色偏向角不同而分開。</p><a href="index.html">← 返回目錄</a></header>
<div class="wrap"><div class="stage"><canvas id="cv"></canvas></div>
<div class="panel">
<h3>參數</h3>
<div class="ctl"><label>稜鏡材料 <select id="mat"><option value="1.5046,0.00420">冕牌玻璃 BK7</option><option value="1.5942,0.00895">火石玻璃 F2</option><option value="1.3240,0.00309">水</option></select></label></div>
<div class="ctl"><label for="A">頂角 A<b id="v_A"></b></label><input type="range" id="A" min="30" max="75" step="1" value="60" data-u="°"></div>
<div class="ctl"><label for="i1">入射角 i（左側面）<b id="v_i1"></b></label><input type="range" id="i1" min="20" max="89" step="0.5" value="50" data-u="°"></div>
<div class="ctl"><label for="mag">畫面色散放大倍率（示意）<b id="v_mag"></b></label><input type="range" id="mag" min="1" max="10" step="1" value="4" data-u="×"></div>
<div class="formula">柯西公式 n(λ) = A₀ + B / λ²</div>
<div class="note" id="cauchy"></div>
<table id="tb"></table>
<h3>即時數據</h3>
<div class="read"><span>紫光與紅光的偏向角差 Δδ</span><b id="r_spread">—</b></div>
<div class="read"><span>黃光（589 nm）最小偏向角 δmin</span><b id="r_dmin">—</b></div>
<div class="read"><span>發生 δmin 的入射角</span><b id="r_imin">—</b></div>
<p class="note">表格與數據皆為真實值；畫面上色散被放大（倍率可調）以便觀察，放大倍率 1× 即真實比例。</p>
<label class="chk"><input type="checkbox" id="rb">顯示彩虹（水滴）說明</label>
<div id="rbnote" class="note" style="display:none"></div>
</div></div>
<script>const $=id=>document.getElementById(id),D2R=Math.PI/180,R2D=180/Math.PI;
const val=id=>parseFloat($(id).value);
const out=(id,t)=>{const e=$(id);if(e)e.innerHTML=t;};
const f=(x,d=2)=>Number.isFinite(x)?x.toFixed(d):'—';
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1];
const FONT='"Segoe UI","Helvetica Neue",Arial,"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei","Noto Sans","DejaVu Sans",sans-serif';
window.onerror=m=>{document.body.setAttribute('data-err',String(m));};
function setup(cv){const r=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;if(cv.width!==Math.round(w*r)||cv.height!==Math.round(h*r)){cv.width=Math.round(w*r);cv.height=Math.round(h*r);}const c=cv.getContext('2d');c.setTransform(r,0,0,r,0,0);c.clearRect(0,0,w,h);return{c,w,h};}
function line(c,x1,y1,x2,y2,col,lw=2,dash){c.save();c.strokeStyle=col;c.lineWidth=lw;if(dash)c.setLineDash(dash);c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();c.restore();}
function ray(c,x1,y1,x2,y2,col,lw=3,alpha=1,at=0.5){c.save();c.globalAlpha=Math.max(0,Math.min(1,alpha));line(c,x1,y1,x2,y2,col,lw);const mx=x1+(x2-x1)*at,my=y1+(y2-y1)*at,a=Math.atan2(y2-y1,x2-x1),s=6+lw*1.5;c.fillStyle=col;c.beginPath();c.moveTo(mx+s*Math.cos(a),my+s*Math.sin(a));c.lineTo(mx+s*Math.cos(a+2.6),my+s*Math.sin(a+2.6));c.lineTo(mx+s*Math.cos(a-2.6),my+s*Math.sin(a-2.6));c.closePath();c.fill();c.restore();}
function arcA(c,x,y,r,a1,a2,col,lw=1.6){let d=a2-a1;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;c.save();c.strokeStyle=col;c.lineWidth=lw;c.beginPath();c.arc(x,y,r,a1,a1+d,d<0);c.stroke();c.restore();}
function text(c,s,x,y,col='#e8ecff',size=15,align='left',bold){c.save();c.fillStyle=col;c.font=`${bold?'bold ':''}${size}px ${FONT}`;c.textAlign=align;c.fillText(s,x,y);c.restore();}
function refractV(d,nr,n1,n2){const ci=-dot(nr,d),e=n1/n2,k=1-e*e*(1-ci*ci);if(k<0)return null;const s=e*ci-Math.sqrt(k);return[e*d[0]+s*nr[0],e*d[1]+s*nr[1]];}
function reflectV(d,nr){const k=2*dot(d,nr);return[d[0]-k*nr[0],d[1]-k*nr[1]];}
function rot(v,a){const c=Math.cos(a),s=Math.sin(a);return[v[0]*c-v[1]*s,v[0]*s+v[1]*c];}
function fresnelR(n1,n2,ti){const st=n1/n2*Math.sin(ti);if(st>=1)return 1;const tt=Math.asin(st),ci=Math.cos(ti),ct=Math.cos(tt);const rs=((n1*ci-n2*ct)/(n1*ci+n2*ct))**2,rp=((n1*ct-n2*ci)/(n1*ct+n2*ci))**2;return(rs+rp)/2;}
function medium(n){return `rgba(90,160,255,${Math.min(0.04+(n-1)*0.28,0.55).toFixed(3)})`;}
function plot(cv,o){const {c,w,h}=setup(cv);const L=46,Rr=12,T=14,B=30;const X=x=>L+(x-o.x0)/(o.x1-o.x0)*(w-L-Rr),Y=y=>h-B-(y-o.y0)/(o.y1-o.y0)*(h-T-B);
 c.strokeStyle='#26305a';c.lineWidth=1;
 (o.xt||[]).forEach(t=>{line(c,X(t),T,X(t),h-B,'#1f2a50',1);text(c,String(t),X(t),h-B+15,'#8a96c0',11,'center');});
 (o.yt||[]).forEach(t=>{line(c,L,Y(t),w-Rr,Y(t),'#1f2a50',1);text(c,String(t),L-5,Y(t)+4,'#8a96c0',11,'right');});
 line(c,L,T,L,h-B,'#5a6799',1.2);line(c,L,h-B,w-Rr,h-B,'#5a6799',1.2);
 c.save();c.beginPath();c.rect(L,T,w-L-Rr,h-T-B);c.clip();
 (o.hl||[]).forEach(s=>line(c,L,Y(s.y),w-Rr,Y(s.y),s.col,1.2,[5,4]));
 (o.series||[]).forEach(s=>{c.strokeStyle=s.col;c.lineWidth=s.lw||2;if(s.dash)c.setLineDash(s.dash);else c.setLineDash([]);c.beginPath();let pen=false;s.pts.forEach(p=>{if(!p||!Number.isFinite(p[1])){pen=false;return;}const px=X(p[0]),py=Y(p[1]);pen?c.lineTo(px,py):c.moveTo(px,py);pen=true;});c.stroke();});
 c.restore();
 (o.marks||[]).forEach(m=>{if(!Number.isFinite(m.y))return;c.fillStyle=m.col;c.beginPath();c.arc(X(m.x),Y(m.y),5,0,7);c.fill();if(m.label)text(c,m.label,X(m.x)+(m.dx||8),Y(m.y)+(m.dy||-8),m.col,12,m.align||'left');});
 text(c,o.xl||'',w-Rr,h-4,'#9fb0e0',12,'right');text(c,o.yl||'',L+4,T+10,'#9fb0e0',12);
 (o.legend||[]).forEach((g,i)=>{line(c,w-150,T+10+i*16,w-128,T+10+i*16,g.col,2.5,g.dash);text(c,g.t,w-122,T+14+i*16,'#cfd8ff',12);});
 return{c,X,Y};}
function syncLabels(){document.querySelectorAll('input[type=range]').forEach(e=>{const b=$('v_'+e.id);if(b){const d=+(e.dataset.d??(e.step.includes('.')?e.step.split('.')[1].length:0));b.textContent=parseFloat(e.value).toFixed(d)+(e.dataset.u||'');}});}
function bindAll(fn){new URLSearchParams(location.search).forEach((v,k)=>{const e=$(k);if(!e)return;if(e.type==='checkbox')e.checked=v==='1';else e.value=v;});const g=()=>{syncLabels();fn();};document.querySelectorAll('input,select').forEach(e=>{e.addEventListener('input',g);e.addEventListener('change',g);});window.addEventListener('resize',g);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(g);g();}
function sl(id,label,min,max,step,v,u=''){return '';}

function prismPts(cx,top,S,A){const h2=A/2;return[[cx,top],[cx+S*Math.sin(h2),top+S*Math.cos(h2)],[cx-S*Math.sin(h2),top+S*Math.cos(h2)]];}
function outN(poly){const cx=(poly[0][0]+poly[1][0]+poly[2][0])/3,cy=(poly[0][1]+poly[1][1]+poly[2][1])/3;return poly.map((p,i)=>{const q=poly[(i+1)%poly.length];let n=[q[1]-p[1],-(q[0]-p[0])];const l=Math.hypot(n[0],n[1]);n=[n[0]/l,n[1]/l];if(dot(n,[(p[0]+q[0])/2-cx,(p[1]+q[1])/2-cy])<0)n=[-n[0],-n[1]];return n;});}
function segHit(P,d,a,b){const e=[b[0]-a[0],b[1]-a[1]],den=d[0]*e[1]-d[1]*e[0];if(Math.abs(den)<1e-12)return null;const w=[a[0]-P[0],a[1]-P[1]],t=(w[0]*e[1]-w[1]*e[0])/den,u=(w[0]*d[1]-w[1]*d[0])/den;if(u<-1e-9||u>1+1e-9)return null;return t;}
// enter prism through left face (edge 2) at fraction fr from apex with incidence i (rad). returns {pts, exit, inDir, tir}
function tracePrism(poly,i,n,fr){const ns=outN(poly),A=poly[0],B=poly[2];const E=[A[0]+(B[0]-A[0])*fr,A[1]+(B[1]-A[1])*fr];const inward=[-ns[2][0],-ns[2][1]];const d0=rot(inward,-i);
 let d=refractV(d0,ns[2],1,n);const pts=[E];let P=E,cur=2,tir=false;
 for(let k=0;k<6;k++){let best=Infinity,bi=-1;for(let j=0;j<3;j++){if(j===cur)continue;const t=segHit(P,d,poly[j],poly[(j+1)%3]);if(t!==null&&t>1e-6&&t<best){best=t;bi=j;}}
  if(bi<0)break;P=[P[0]+d[0]*best,P[1]+d[1]*best];pts.push(P);const t=refractV(d,[-ns[bi][0],-ns[bi][1]],n,1);
  if(t)return{E,d0,pts,exit:t,edge:bi,tir};tir=true;d=reflectV(d,ns[bi]);cur=bi;}
 return{E,d0,pts,exit:null,tir:true};}
function prismDev(n,A,i){const r1=Math.asin(Math.sin(i)/n),r2=A-r1,s=n*Math.sin(r2);if(Math.abs(s)>1)return NaN;return i+Math.asin(s)-A;}
function minDev(n,A){let best=Infinity,bi=NaN;for(let i=0;i<=90;i+=0.02){const d=prismDev(n,A,i*D2R);if(d<best){best=d;bi=i;}}if(!Number.isFinite(best))return{d:NaN,i:NaN};
 const ia=Math.asin(Math.min(1,n*Math.sin(A/2)));return{d:2*ia-A,i:ia*R2D};}

const cv=$('cv');
const COLS=[[410,'#9b6bff','紫'],[450,'#4f7bff','藍'],[486,'#22d3ee','青'],[530,'#2ee66b','綠'],[580,'#ffe14d','黃'],[610,'#ff9a3c','橙'],[656,'#ff4848','紅']];
function nC(A0,B,lam){const l=lam/1000;return A0+B/(l*l);}
function draw(){
 const {c,w,h}=setup(cv);const [A0,B]=$('mat').value.split(',').map(Number),A=val('A')*D2R,i1=val('i1')*D2R,mag=val('mag'),rb=$('rb').checked;
 const nD=nC(A0,B,589),S=Math.min(400,h*0.62),cx=w*0.34,top=110,poly=prismPts(cx,top,S,A);
 c.beginPath();c.moveTo(...poly[0]);c.lineTo(...poly[1]);c.lineTo(...poly[2]);c.closePath();c.fillStyle='rgba(160,200,255,.13)';c.fill();c.strokeStyle='#9fc0ff';c.lineWidth=1.5;c.stroke();
 arcA(c,poly[0][0],poly[0][1],36,Math.PI/2-A/2,Math.PI/2+A/2,'#cfe0ff');text(c,`A = ${f(A*R2D,0)}°`,poly[0][0],poly[0][1]-12,'#cfe0ff',15,'center',1);
 const ref=tracePrism(poly,i1,nD,0.5);const E=ref.E,d0=ref.d0;
 // normal at entry
 const ns=outN(poly);line(c,E[0]-ns[2][0]*70,E[1]-ns[2][1]*70,E[0]+ns[2][0]*90,E[1]+ns[2][1]*90,'#8890b0',1,[5,5]);
 ray(c,E[0]-d0[0]*330,E[1]-d0[1]*330,E[0],E[1],'#ffffff',4);text(c,'白光',E[0]-d0[0]*300,E[1]-d0[1]*300-12,'#ffffff',15);
 const a0=Math.atan2(ns[2][1],ns[2][0]),ad=Math.atan2(-d0[1],-d0[0]);arcA(c,E[0],E[1],44,a0,ad,'#ffffff');
 text(c,`i = ${f(i1*R2D,1)}°`,E[0]-60,E[1]+50,'#ffffff',14,'right');
 c.save();c.globalCompositeOperation='lighter';const rows=[];let anyTIR=false;
 COLS.forEach(([lam,col,name])=>{const n=nC(A0,B,lam),nd=nD+(n-nD)*mag,tr=tracePrism(poly,i1,nd,0.5),dv=prismDev(n,A,i1);rows.push([lam,col,name,n,dv]);
  c.globalAlpha=0.9;for(let k=0;k+1<tr.pts.length;k++)line(c,tr.pts[k][0],tr.pts[k][1],tr.pts[k+1][0],tr.pts[k+1][1],col,1.6);
  if(tr.exit){const P=tr.pts[tr.pts.length-1];line(c,P[0],P[1],P[0]+tr.exit[0]*700,P[1]+tr.exit[1]*700,col,3);}else anyTIR=true;});
 c.restore();
 // undeviated reference & deviation arc for yellow
 const yl=tracePrism(poly,i1,nD,0.5);if(yl.exit){const P=yl.pts[yl.pts.length-1];line(c,E[0],E[1],E[0]+d0[0]*620,E[1]+d0[1]*620,'rgba(255,255,255,.35)',1.2,[3,6]);
  // intersection of incoming line and outgoing yellow line
  const den=d0[0]*yl.exit[1]-d0[1]*yl.exit[0];if(Math.abs(den)>1e-6){const t=((P[0]-E[0])*yl.exit[1]-(P[1]-E[1])*yl.exit[0])/den,X=[E[0]+d0[0]*t,E[1]+d0[1]*t];const a1=Math.atan2(d0[1],d0[0]),a2=Math.atan2(yl.exit[1],yl.exit[0]);arcA(c,X[0],X[1],170,a1,a2,'#ffe14d',1.5);text(c,`δ（黃光）= ${f(prismDev(nD,A,i1)*R2D,2)}°`,X[0]+178*Math.cos((a1+a2)/2),X[1]+178*Math.sin((a1+a2)/2)+18,'#ffe14d',15,'left',1);}}
 if(anyTIR)text(c,'部分色光在第二面發生全反射（入射角太小或頂角太大）',20,h-20,'#ff7b7b',15);
 out('cauchy',`本材料：A₀ = ${A0}，B = ${B} μm²（λ 以 μm 計）；n<sub>D</sub>(589 nm) = ${f(nD,4)}`);
 let tb='<tr><th style="text-align:left">色光</th><th>λ (nm)</th><th>n</th><th>偏向角 δ</th></tr>';
 rows.forEach(r=>tb+=`<tr><td style="text-align:left;color:${r[1]}">● ${r[2]}</td><td>${r[0]}</td><td>${f(r[3],4)}</td><td>${Number.isFinite(r[4])?f(r[4]*R2D,2)+'°':'全反射'}</td></tr>`);$('tb').innerHTML=tb;
 const sp=rows[0][4]-rows[6][4];out('r_spread',Number.isFinite(sp)?f(sp*R2D,2)+'°':'—');
 const md=minDev(nD,A);out('r_dmin',f(md.d*R2D,2)+'°');out('r_imin',f(md.i,2)+'°');
 // rainbow
 $('rbnote').style.display=rb?'block':'none';
 if(rb){const bw=380,bh=178,bx=14,by=h-bh-12;c.fillStyle='rgba(6,10,24,.92)';c.fillRect(bx,by,bw,bh);c.strokeStyle='#34437a';c.strokeRect(bx,by,bw,bh);
  text(c,'水滴中的主虹光路（一次內反射）',bx+12,by+22,'#cfe0ff',14);const C=[bx+bw*0.62,by+bh*0.56],R=50;
  c.beginPath();c.arc(C[0],C[1],R,0,7);c.fillStyle='rgba(90,160,255,.18)';c.fill();c.strokeStyle='#9fc0ff';c.stroke();
  const nWD=nC(1.3240,0.00309,589);let html='<table><tr><th style="text-align:left">色光</th><th>n(水)</th><th>彩虹角</th></tr>';
  c.save();c.beginPath();c.rect(bx,by,bw,bh);c.clip();c.globalCompositeOperation='lighter';
  [[656,'#ff4848','紅'],[410,'#9b6bff','紫']].forEach(([lam,col,nm])=>{const n=nC(1.3240,0.00309,lam),nd=nWD+(n-nWD)*mag;
   const ang=x=>{const ci=Math.sqrt((x*x-1)/3),i=Math.acos(ci),r=Math.asin(Math.sin(i)/x);return{i,dev:Math.PI+2*i-4*r};};
   const real=ang(n),dr=ang(nd),i=dr.i;html+=`<tr><td style="text-align:left;color:${col}">● ${nm} ${lam} nm</td><td>${f(n,4)}</td><td>${f(180-real.dev*R2D,2)}°</td></tr>`;
   const P1=[C[0]-R*Math.cos(i),C[1]-R*Math.sin(i)],d=[1,0];const d1=refractV(d,[(P1[0]-C[0])/R,(P1[1]-C[1])/R],1,nd);
   const t1=-2*dot([P1[0]-C[0],P1[1]-C[1]],d1),P2=[P1[0]+d1[0]*t1,P1[1]+d1[1]*t1];const d2=reflectV(d1,[(P2[0]-C[0])/R,(P2[1]-C[1])/R]);
   const t2=-2*dot([P2[0]-C[0],P2[1]-C[1]],d2),P3=[P2[0]+d2[0]*t2,P2[1]+d2[1]*t2];const d3=refractV(d2,[-(P3[0]-C[0])/R,-(P3[1]-C[1])/R],nd,1);
   line(c,bx+8,P1[1],P1[0],P1[1],'#ffffff',1.5);line(c,P1[0],P1[1],P2[0],P2[1],col,1.8);line(c,P2[0],P2[1],P3[0],P3[1],col,1.8);if(d3)line(c,P3[0],P3[1],P3[0]+d3[0]*160,P3[1]+d3[1]*160,col,2.5);});
  c.restore();text(c,'陽光 →',bx+12,by+bh-14,'#ffffff',13);text(c,'紅 ≈ 42°、紫 ≈ 40.6°',bx+12,by+42,'#cfd8ff',12);
