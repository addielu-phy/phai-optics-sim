<h2 class="sec">真實影像對照：斯涅爾窗與水面全反射</h2>
<p class="sub">按「套用到模擬」，把太陽仰角、水面波動與深度調成接近畫面的情況，再和上方的仰望影像比較。照片檔放進網站的 <code>images/</code> 資料夾（檔名見各卡片）即會自動顯示；未放入前以模擬示意圖代替。</p>

<script>const $=id=>document.getElementById(id),D2R=Math.PI/180,R2D=180/Math.PI;
const val=id=>parseFloat($(id).value);
const out=(id,t)=>{const e=$(id);if(e)e.innerHTML=t;};
const f=(x,d=2)=>Number.isFinite(x)?x.toFixed(d):'—';
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1];
const FONT='"Segoe UI","Helvetica Neue",Arial,"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei","Noto Sans","DejaVu Sans",sans-serif';
window.onerror=m=>{document.body.setAttribute('data-err',String(m));};
function setup(cv){const r=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;if(cv.width!==Math.round(w*r)||cv.height!==Math.round(h*r)){cv.width=Math.round(w*r);cv.height=Math.round(h*r);}const c=cv.getContext('2d');c.setTransform(r,0,0,r,0,0);c.clearRect(0,0,w,h);return{c,w,h};}
function line(c,x1,y1,x2,y2,col,lw=2,dash){c.save();c.strokeStyle=col;c.lineWidth=lw;if(dash)c.setLineDash(dash);c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();c.restore();}
function ray(c,x1,y1,x2,y2,col,lw=3,alpha=1,at=0.5){c.save();c.globalAlpha=Math.max(0,Math.min(1,alpha));line(c,x1,y1,x2,y2,col,lw);const mx=x1+(x2-x1)*at,my=y1+(y2-y1)*at,a=Math.atan2(y2-y1,x2-x1),s=6+lw*1.5;c.fillStyle=col;c.beginPath();c.moveTo(mx+s*Math.cos(a),my+s*Math.sin(a));c.lineTo(mx+s*Math.cos(a+2.6),my+s*Math.sin(a+2.6));c.lineTo(mx+s*Math.cos(a-2.6),my+s*Math.sin(a-2.6));c.closePath();c.fill();c.restore();}
function arcA(c,x,y,r,a1,a2,col,lw=1.6){let d=a2-a1;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;c.save();c.strokeStyle=col;c.lineWidth=lw;c.beginPath();c.arc(x,y,r,a1,a1+d,d<0);c.stroke();c.restore();}
function text(c,s,x,y,col='#e8ecff',size=15,align='left',bold){c.save();c.fillStyle=col;c.font=`${bold?'bold ':''}${size}px ${FONT}`;c.textAlign=align;c.fillText(s,x,y);c.restore();}
function refractV(d,nr,n1,n2){const ci=-dot(nr,d),e=n1/n2,k=1-e*e*(1-ci*ci);if(k<0)return null;const s=e*ci-Math.sqrt(k);return[e*d[0]+s*nr[0],e*d[1]+s*nr[1]];}
function reflectV(d,nr){const k=2*dot(d,nr);return[d[0]-k*nr[0],d[1]-k*nr[1]];}
function rot(v,a){const c=Math.cos(a),s=Math.sin(a);return[v[0]*c-v[1]*s,v[0]*s+v[1]*c];}
function fresnelR(n1,n2,ti){const st=n1/n2*Math.sin(ti);if(st>=1)return 1;const tt=Math.asin(st),ci=Math.cos(ti),ct=Math.cos(tt);const rs=((n1*ci-n2*ct)/(n1*ci+n2*ct))**2,rp=((n1*ct-n2*ci)/(n1*ct+n2*ci))**2;return(rs+rp)/2;}
function medium(n){return `rgba(90,160,255,${Math.min(0.04+(n-1)*0.28,0.55).toFixed(3)})`;}
function plot(cv,o){const {c,w,h}=setup(cv);const L=46,Rr=12,T=14,B=30;const X=x=>L+(x-o.x0)/(o.x1-o.x0)*(w-L-Rr),Y=y=>h-B-(y-o.y0)/(o.y1-o.y0)*(h-T-B);
 c.strokeStyle='#26305a';c.lineWidth=1;
 (o.xt||[]).forEach(t=>{line(c,X(t),T,X(t),h-B,'#1f2a50',1);text(c,String(t),X(t),h-B+15,'#8a96c0',11,'center');});
 (o.yt||[]).forEach(t=>{line(c,L,Y(t),w-Rr,Y(t),'#1f2a50',1);text(c,String(t),L-5,Y(t)+4,'#8a96c0',11,'right');});
 line(c,L,T,L,h-B,'#5a6799',1.2);line(c,L,h-B,w-Rr,h-B,'#5a6799',1.2);
 c.save();c.beginPath();c.rect(L,T,w-L-Rr,h-T-B);c.clip();
 (o.hl||[]).forEach(s=>line(c,L,Y(s.y),w-Rr,Y(s.y),s.col,1.2,[5,4]));
 (o.series||[]).forEach(s=>{c.strokeStyle=s.col;c.lineWidth=s.lw||2;if(s.dash)c.setLineDash(s.dash);else c.setLineDash([]);c.beginPath();let pen=false;s.pts.forEach(p=>{if(!p||!Number.isFinite(p[1])){pen=false;return;}const px=X(p[0]),py=Y(p[1]);pen?c.lineTo(px,py):c.moveTo(px,py);pen=true;});c.stroke();});
 c.restore();
 (o.marks||[]).forEach(m=>{if(!Number.isFinite(m.y))return;c.fillStyle=m.col;c.beginPath();c.arc(X(m.x),Y(m.y),5,0,7);c.fill();if(m.label)text(c,m.label,X(m.x)+(m.dx||8),Y(m.y)+(m.dy||-8),m.col,12,m.align||'left');});
 text(c,o.xl||'',w-Rr,h-4,'#9fb0e0',12,'right');text(c,o.yl||'',L+4,T+10,'#9fb0e0',12);
 (o.legend||[]).forEach((g,i)=>{line(c,w-150,T+10+i*16,w-128,T+10+i*16,g.col,2.5,g.dash);text(c,g.t,w-122,T+14+i*16,'#cfd8ff',12);});
 return{c,X,Y};}
function syncLabels(){document.querySelectorAll('input[type=range]').forEach(e=>{const b=$('v_'+e.id);if(b){const d=+(e.dataset.d??(e.step.includes('.')?e.step.split('.')[1].length:0));b.textContent=parseFloat(e.value).toFixed(d)+(e.dataset.u||'');}});}
function bindAll(fn){new URLSearchParams(location.search).forEach((v,k)=>{const e=$(k);if(!e)return;if(e.type==='checkbox')e.checked=v==='1';else e.value=v;});const g=()=>{syncLabels();fn();};document.querySelectorAll('input,select').forEach(e=>{e.addEventListener('input',g);e.addEventListener('change',g);});window.addEventListener('resize',g);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(g);g();}
function sl(id,label,min,max,step,v,u=''){return '';}

// shared light UI: tabs, timeline, controls
const UI={T:4,t:0,play:true,speed:1,tab:0,tabs:[],last:0};
function partial(c,pts,p,col,lw=2.5,dash){let L=0;const seg=[];for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);seg.push(d);L+=d;}let rem=L*Math.max(0,Math.min(1,p));c.save();c.strokeStyle=col;c.lineWidth=lw;if(dash)c.setLineDash(dash);c.beginPath();c.moveTo(pts[0][0],pts[0][1]);let end=pts[0];for(let i=1;i<pts.length&&rem>0;i++){const k=Math.min(1,rem/seg[i-1]);end=[pts[i-1][0]+(pts[i][0]-pts[i-1][0])*k,pts[i-1][1]+(pts[i][1]-pts[i-1][1])*k];c.lineTo(end[0],end[1]);rem-=seg[i-1];}c.stroke();c.restore();return end;}
function txt(c,s,x,y,col='#24323a',size=12,align='left',bold){c.save();c.fillStyle=col;c.font=`${bold?'bold ':''}${size}px "Noto Sans TC","Noto Sans CJK TC",sans-serif`;c.textAlign=align;c.fillText(s,x,y);c.restore();}
function tag(c,s,x,y,col,bg='rgba(255,255,255,.85)',size=11){c.save();c.font=`${size}px "Noto Sans TC","Noto Sans CJK TC",sans-serif`;const w=c.measureText(s).width+8;c.fillStyle=bg;c.fillRect(x-2,y-size,w,size+5);c.strokeStyle=col;c.lineWidth=.8;c.strokeRect(x-2,y-size,w,size+5);c.fillStyle=col;c.fillText(s,x+2,y);c.restore();}
function lsetup(cv){const r=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;if(cv.width!==Math.round(w*r)||cv.height!==Math.round(h*r)){cv.width=Math.round(w*r);cv.height=Math.round(h*r);}const c=cv.getContext('2d');c.setTransform(r,0,0,r,0,0);c.clearRect(0,0,w,h);return{c,w,h};}
function eyeIcon(c,x,y,ang=0,s=1){c.save();c.translate(x,y);c.rotate(ang);c.scale(s,s);c.fillStyle='#fff';c.strokeStyle='#222';c.lineWidth=1.5;c.beginPath();c.ellipse(0,0,11,7,0,0,7);c.fill();c.stroke();c.fillStyle='#222';c.beginPath();c.arc(0,0,3.6,0,7);c.fill();c.restore();}
function V(id){const e=$(id);if(!e)return NaN;if(e.type==='checkbox')return e.checked;return e.tagName==='SELECT'?e.value:parseFloat(e.value);}
function buildCtrls(tab){const box=$('ctrls');box.innerHTML='';(tab.ctrls||[]).forEach(k=>{const d=document.createElement('div');d.className='ctl';
 if(k.sel){d.innerHTML=`<label>${k.label}</label><select id="${k.id}">${k.sel.map(o=>`<option value="${o[0]}"${o[0]==k.v?' selected':''}>${o[1]}</option>`).join('')}</select>`;}
 else if(k.chk){d.className='ctl chk';d.innerHTML=`<label><input type="checkbox" id="${k.id}"${k.v?' checked':''}>${k.label}</label>`;}
 else d.innerHTML=`<label for="${k.id}">${k.label}<b id="v_${k.id}"></b></label><input type="range" id="${k.id}" min="${k.min}" max="${k.max}" step="${k.step}" value="${k.v}" data-u="${k.u||''}">`;
 box.appendChild(d);});
 box.querySelectorAll('input,select').forEach(e=>{e.addEventListener('input',()=>{syncL();if(tab.onchange)tab.onchange(e.id);render();});});
 $('cards').innerHTML=(tab.cards||[]).map(k=>`<div class="card"><span>${k[1]}</span><b id="${k[0]}">—</b></div>`).join('');
 $('note').innerHTML='<summary>觀察後的補充說明</summary>'+(tab.note||'');syncL();}
function syncL(){document.querySelectorAll('#ctrls input[type=range]').forEach(e=>{const b=$('v_'+e.id);if(b){const st=e.step.includes('.')?e.step.split('.')[1].length:0;b.textContent=parseFloat(e.value).toFixed(st)+(e.dataset.u||'');}});}
function setTab(i){UI.tab=i;document.querySelectorAll('.tabs button').forEach((b,j)=>b.classList.toggle('on',j===i));buildCtrls(UI.tabs[i]);if(UI.tabs[i].init)UI.tabs[i].init();UI.t=0;render();}
function resetTab(){setTab(UI.tab);}
function render(){const tb=UI.tabs[UI.tab];$('tlr').value=UI.t/UI.T*1000;$('tlv').textContent=UI.t.toFixed(2)+' s';try{tb.draw(Math.min(1,UI.t/(UI.T*0.8)));}catch(e){document.body.setAttribute('data-err',String(e&&e.stack||e));throw e;}}
function initUI(tabs){UI.tabs=tabs;$('tabs').innerHTML=tabs.map((t,i)=>`<button>${t.name}</button>`).join('');document.querySelectorAll('.tabs button').forEach((b,i)=>b.onclick=()=>setTab(i));
 $('tlr').oninput=e=>{UI.t=e.target.value/1000*UI.T;render();};$('tlp').onclick=()=>{UI.t=Math.max(0,UI.t-0.1);render();};$('tln').onclick=()=>{UI.t=Math.min(UI.T,UI.t+0.1);render();};
 $('sp').oninput=e=>{UI.speed=+e.target.value;$('spv').textContent='目前 '+UI.speed.toFixed(1)+'×';};
 $('pp').onclick=()=>{UI.play=!UI.play;$('pp').textContent=UI.play?'⏸ 暫停':'▶ 播放';};$('rs').onclick=resetTab;
 window.addEventListener('resize',render);
 const q=new URLSearchParams(location.search);setTab(Math.min(tabs.length-1,+(q.get('tab')||0)));if(q.has('t')){UI.t=+q.get('t');UI.play=false;$('pp').textContent='▶ 播放';render();}
 function loop(ts){requestAnimationFrame(loop);const dt=Math.min(0.05,(ts-(UI.last||ts))/1000);UI.last=ts;if(UI.play){UI.t+=dt*UI.speed;if(UI.t>UI.T)UI.t=0;try{render();}catch(e){}}}requestAnimationFrame(loop);}

const cv=$('cv');const fish=document.createElement('canvas');fish.id='fish';document.querySelector('.stagewrap').appendChild(fish);
const deg=x=>(x*R2D).toFixed(1)+'°';const o2=(id,s)=>{const e=$(id);if(e)e.textContent=s;};
const MED=[['1.33','水 n = 1.33'],['1.34','海水 n = 1.34'],['1.50','玻璃 n = 1.50'],['2.42','鑽石 n = 2.42']];
const ENV=[['pool','泳池（明亮池底）'],['sea','海洋（深藍）'],['lake','湖泊（綠色）']];
const ENVC={pool:['#2f8f9c','#1d6874','#5fb7c2'],sea:['#123d6a','#0a2647','#1f5a8a'],lake:['#2f6b4a','#1d4a32','#4f8f62']};
const HB=0.8; // 浮球球心在水面下 0.8 m
// ---------- fisheye renderer (equidistant, 160° FOV) ----------
function fisheye(cnv,P,label=true){const{c,w,h}=lsetup(cnv);const n=P.n,tc=Math.asin(1/n),cx=w/2,cy=h/2,R=Math.min(w,h)/2-6,F=80*D2R,rp=a=>a/F*R;
 c.fillStyle='#000';c.fillRect(0,0,w,h);const E=ENVC[P.env];
 c.save();c.beginPath();c.arc(cx,cy,R,0,7);c.clip();
 let g=c.createRadialGradient(cx,cy,rp(tc),cx,cy,R);g.addColorStop(0,E[2]);g.addColorStop(1,E[1]);c.fillStyle=g;c.fillRect(0,0,w,h);
 if(P.env==='pool'){c.strokeStyle='rgba(10,40,50,.55)';c.lineWidth=2.2;for(let k=-6;k<=6;k++){c.beginPath();for(let a=tc*R2D+1;a<=80;a+=2){const ph=a*D2R,y=Math.tan(Math.min(ph,1.45))*1;const x=k*0.35;const r=rp(ph);const az=Math.atan2(x,1);c.lineTo(cx+r*Math.sin(az+k*0.24)+Math.sin(a*0.4+k)*2*P.wave,cy-r*Math.cos(az+k*0.24));}c.stroke();}}
 // window with wavy edge
 const amp=P.wave*0.06*R;c.beginPath();for(let i=0;i<=180;i++){const az=i/180*2*Math.PI;const r=rp(tc)+amp*(0.6*Math.sin(5*az+1)+0.4*Math.sin(11*az+2))*(1);i?c.lineTo(cx+r*Math.cos(az),cy+r*Math.sin(az)):c.moveTo(cx+r*Math.cos(az),cy+r*Math.sin(az));}c.closePath();
 g=c.createRadialGradient(cx,cy,0,cx,cy,rp(tc));g.addColorStop(0,'#cfe9ff');g.addColorStop(0.75,'#8cc4f0');g.addColorStop(1,'#e8f3ff');c.save();c.fillStyle=g;c.fill();c.clip();
 c.fillStyle='rgba(255,255,255,.75)';[[0.35,0.5,0.22],[-0.4,-0.3,0.16],[0.1,-0.55,0.12]].forEach(q=>{c.beginPath();c.ellipse(cx+q[0]*rp(tc),cy+q[1]*rp(tc),q[2]*rp(tc),q[2]*rp(tc)*0.6,0.4,0,7);c.fill();});
